<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masken</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1a1a2e; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Segoe UI', system-ui, monospace; color: #e0e0e0; user-select: none; }
    h1 { font-size: 2rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: #7cfc00; text-shadow: 0 0 12px #7cfc0088; margin-bottom: 0.4rem; }
    #scoreboard { display: flex; gap: 2.5rem; margin-bottom: 1rem; font-size: 0.9rem; font-weight: 600; color: #aaa; }
    #scoreboard span { color: #7cfc00; font-size: 1.1rem; }
    #gameWrapper { position: relative; }
    canvas { display: block; border: 2px solid #2a2a4a; border-radius: 6px; box-shadow: 0 0 30px rgba(124,252,0,0.08); background: #0d0d1a; image-rendering: pixelated; }
    #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(13,13,26,0.88); border-radius: 6px; }
    #overlay h2 { font-size: 1.6rem; font-weight: 800; color: #7cfc00; margin-bottom: 0.5rem; }
    #overlay p { color: #aaa; font-size: 0.9rem; margin-bottom: 1.25rem; }
    #overlay .final-score { font-size: 1rem; color: #ddd; margin-bottom: 1.5rem; }
    button { background: #7cfc00; color: #0d0d1a; border: none; border-radius: 6px; padding: 0.65rem 2rem; font-size: 1rem; font-weight: 800; cursor: pointer; text-transform: uppercase; letter-spacing: 0.08em; transition: opacity 0.15s, transform 0.1s; }
    button:hover { opacity: 0.85; transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    #controls { margin-top: 1.1rem; color: #555; font-size: 0.78rem; text-align: center; line-height: 1.8; }
    #dpad { display: none; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(3, 52px); gap: 4px; margin-top: 1.2rem; }
    @media (pointer: coarse) { #dpad { display: grid; } #controls { display: none; } }
    .dpad-btn { background: #1e1e38; border: 1px solid #2a2a4a; border-radius: 8px; color: #7cfc00; font-size: 1.3rem; display: flex; align-items: center; justify-content: center; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background 0.1s; }
    .dpad-btn:active { background: #2a2a4a; }
    .dpad-center { background: transparent; border: none; cursor: default; }
  </style>
</head>
<body>
<h1>Masken</h1>
<div id="scoreboard">Poäng:&nbsp;<span id="scoreDisplay">0</span>&nbsp;&nbsp;Rekord:&nbsp;<span id="highDisplay">0</span></div>
<div id="gameWrapper">
  <canvas id="c"></canvas>
  <div id="overlay">
    <h2 id="overlayTitle">Masken</h2>
    <p id="overlayMsg">Styr masken med piltangenterna eller WASD</p>
    <div class="final-score" id="finalScore" style="display:none"></div>
    <button id="startBtn">Starta spel</button>
  </div>
</div>
<div id="dpad">
  <div></div><div class="dpad-btn" data-dir="UP">&#9650;</div><div></div>
  <div class="dpad-btn" data-dir="LEFT">&#9664;</div><div class="dpad-center"></div><div class="dpad-btn" data-dir="RIGHT">&#9654;</div>
  <div></div><div class="dpad-btn" data-dir="DOWN">&#9660;</div><div></div>
</div>
<div id="controls">Piltangenter eller WASD &nbsp;|&nbsp; P = Paus</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const CELL=18,COLS=22,ROWS=22;
canvas.width=COLS*CELL;canvas.height=ROWS*CELL;
const scoreEl=document.getElementById('scoreDisplay'),highEl=document.getElementById('highDisplay');
const overlay=document.getElementById('overlay'),titleEl=document.getElementById('overlayTitle');
const msgEl=document.getElementById('overlayMsg'),finalEl=document.getElementById('finalScore');
const startBtn=document.getElementById('startBtn');
let snake,dir,nextDir,food,score,highScore,paused,running,loopId;
highScore=parseInt(localStorage.getItem('masken_high')||'0');
highEl.textContent=highScore;
const SPEEDS=[130,110,90,75,60,50];
function getSpeed(){return SPEEDS[Math.min(Math.floor(score/5),SPEEDS.length-1)];}
function rand(max){return Math.floor(Math.random()*max);}
function placeFood(){const occ=new Set(snake.map(s=>s.x+','+s.y));let f;do{f={x:rand(COLS),y:rand(ROWS)};}while(occ.has(f.x+','+f.y));food=f;}
function initGame(){const mx=Math.floor(COLS/2),my=Math.floor(ROWS/2);snake=[{x:mx,y:my},{x:mx-1,y:my},{x:mx-2,y:my}];dir={x:1,y:0};nextDir={x:1,y:0};score=0;paused=false;running=true;scoreEl.textContent=0;placeFood();}
function step(){if(!running||paused)return;dir={...nextDir};const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS){endGame();return;}if(snake.some(s=>s.x===head.x&&s.y===head.y)){endGame();return;}snake.unshift(head);if(head.x===food.x&&head.y===food.y){score++;scoreEl.textContent=score;if(score>highScore){highScore=score;localStorage.setItem('masken_high',highScore);highEl.textContent=highScore;}placeFood();}else{snake.pop();}draw();loopId=setTimeout(step,getSpeed());}
function draw(){ctx.fillStyle='#0d0d1a';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='#111128';ctx.lineWidth=0.5;for(let x=0;x<=COLS;x++){ctx.beginPath();ctx.moveTo(x*CELL,0);ctx.lineTo(x*CELL,canvas.height);ctx.stroke();}for(let y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(0,y*CELL);ctx.lineTo(canvas.width,y*CELL);ctx.stroke();}const fx=food.x*CELL+CELL/2,fy=food.y*CELL+CELL/2,r=CELL/2-2;const grd=ctx.createRadialGradient(fx-r*0.3,fy-r*0.3,1,fx,fy,r);grd.addColorStop(0,'#ff6b6b');grd.addColorStop(1,'#c0392b');ctx.beginPath();ctx.arc(fx,fy,r,0,Math.PI*2);ctx.fillStyle=grd;ctx.fill();ctx.fillStyle='#27ae60';ctx.fillRect(food.x*CELL+CELL/2-2,food.y*CELL+2,5,4);snake.forEach((seg,i)=>{const x=seg.x*CELL+1,y=seg.y*CELL+1,w=CELL-2;if(i===0){const hg=ctx.createLinearGradient(x,y,x+w,y+w);hg.addColorStop(0,'#a0ff40');hg.addColorStop(1,'#4db800');ctx.fillStyle=hg;}else{const t=i/snake.length;ctx.fillStyle=`rgb(60,${Math.round(200-t*80)},20)`;}ctx.beginPath();ctx.roundRect(x,y,w,w,i===0?5:3);ctx.fill();if(i===0){ctx.fillStyle='#0d0d1a';const ex=seg.x*CELL+CELL/2,ey=seg.y*CELL+CELL/2,off=3.5,er=2;let e1,e2;if(dir.x===1){e1=[ex+4,ey-off];e2=[ex+4,ey+off];}else if(dir.x===-1){e1=[ex-4,ey-off];e2=[ex-4,ey+off];}else if(dir.y===-1){e1=[ex-off,ey-4];e2=[ex+off,ey-4];}else{e1=[ex-off,ey+4];e2=[ex+off,ey+4];}ctx.beginPath();ctx.arc(e1[0],e1[1],er,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(e2[0],e2[1],er,0,Math.PI*2);ctx.fill();}});}
function endGame(){running=false;clearTimeout(loopId);draw();ctx.fillStyle='rgba(255,50,50,0.35)';ctx.fillRect(snake[0].x*CELL,snake[0].y*CELL,CELL,CELL);setTimeout(()=>{titleEl.textContent='Game Over';msgEl.textContent='';finalEl.style.display='block';finalEl.textContent=`Poäng: ${score}${score===highScore&&score>0?'  🏆 Nytt rekord!':''}`;startBtn.textContent='Spela igen';overlay.style.display='flex';},400);}
function startGame(){overlay.style.display='none';finalEl.style.display='none';clearTimeout(loopId);initGame();draw();loopId=setTimeout(step,getSpeed());}
startBtn.addEventListener('click',startGame);
const DIRS={ArrowUp:{x:0,y:-1},w:{x:0,y:-1},W:{x:0,y:-1},ArrowDown:{x:0,y:1},s:{x:0,y:1},S:{x:0,y:1},ArrowLeft:{x:-1,y:0},a:{x:-1,y:0},A:{x:-1,y:0},ArrowRight:{x:1,y:0},d:{x:1,y:0},D:{x:1,y:0}};
document.addEventListener('keydown',e=>{if((e.key==='p'||e.key==='P')&&running){paused=!paused;if(!paused){loopId=setTimeout(step,getSpeed());}return;}const d=DIRS[e.key];if(!d)return;e.preventDefault();if(!running&&!paused)return;if(d.x===-dir.x&&d.y===-dir.y)return;nextDir=d;});
const DIR_MAP={UP:{x:0,y:-1},DOWN:{x:0,y:1},LEFT:{x:-1,y:0},RIGHT:{x:1,y:0}};
document.querySelectorAll('.dpad-btn').forEach(btn=>{btn.addEventListener('touchstart',e=>{e.preventDefault();const d=DIR_MAP[btn.dataset.dir];if(!d||!running)return;if(d.x===-dir.x&&d.y===-dir.y)return;nextDir=d;},{passive:false});});
let touchStart=null;
canvas.addEventListener('touchstart',e=>{touchStart=e.touches[0];},{passive:true});
canvas.addEventListener('touchend',e=>{if(!touchStart||!running)return;const dx=e.changedTouches[0].clientX-touchStart.clientX,dy=e.changedTouches[0].clientY-touchStart.clientY;if(Math.abs(dx)<10&&Math.abs(dy)<10)return;let d;if(Math.abs(dx)>Math.abs(dy)){d=dx>0?DIR_MAP.RIGHT:DIR_MAP.LEFT;}else{d=dy>0?DIR_MAP.DOWN:DIR_MAP.UP;}if(d.x===-dir.x&&d.y===-dir.y)return;nextDir=d;touchStart=null;},{passive:true});
ctx.fillStyle='#0d0d1a';ctx.fillRect(0,0,canvas.width,canvas.height);
</script>
</body>
</html>
